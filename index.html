<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiminalShock - Red Liminal & Dreamcore</title>
  <!-- FontAwesome para Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=VT323&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg-dark: #030811;
      --bg-card: rgba(10, 25, 47, 0.85);
      --accent-cyan: #00f0ff;
      --accent-blue: #0077ff;
      --glow-blue: rgba(0, 240, 255, 0.4);
      --text-main: #e2f1ff;
      --text-dim: #7b9acc;
      --border-glow: rgba(0, 240, 255, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(0, 119, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.08) 0%, transparent 40%);
      background-attachment: fixed;
    }

    .bg-grid {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-size: 50px 50px;
      background-image: 
        linear-gradient(to right, rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      z-index: -2;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(3, 8, 17, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-glow);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .eye-icon {
      font-size: 1.6rem;
      color: var(--accent-cyan);
      text-shadow: 0 0 12px var(--accent-cyan);
      animation: pulseEye 3s infinite alternate;
    }

    @keyframes pulseEye {
      0% { transform: scale(1); filter: drop-shadow(0 0 2px var(--accent-cyan)); }
      100% { transform: scale(1.15); filter: drop-shadow(0 0 10px var(--accent-cyan)); }
    }

    .logo-text {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(45deg, #ffffff, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 200px;
      max-width: 400px;
    }

    .search-box input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.5rem;
      border-radius: 30px;
      border: 1px solid var(--border-glow);
      background: rgba(10, 25, 47, 0.9);
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px var(--glow-blue);
    }

    .search-box i {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent-cyan);
    }

    .main-container {
      max-width: 1400px;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }

    .hero-window {
      background: var(--bg-card);
      border: 1px solid var(--accent-cyan);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), 0 0 12px var(--glow-blue);
      margin-bottom: 2rem;
    }

    .window-bar {
      background: linear-gradient(90deg, #002b5c, #0055a5);
      padding: 0.4rem 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'VT323', monospace;
      font-size: 1.1rem;
    }

    .window-controls {
      display: flex;
      gap: 6px;
    }

    .win-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .win-close { background: #ff5f56; }
    .win-min { background: #ffbd2e; }
    .win-max { background: #27c93f; }

    .hero-content {
      padding: 1.5rem;
      text-align: center;
    }

    .hero-content h1 {
      font-size: 2rem;
      margin-bottom: 0.8rem;
    }

    .hero-content p {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
    }

    .btn-liminal {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(0, 119, 255, 0.2));
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }

    .btn-liminal:hover {
      background: var(--accent-cyan);
      color: var(--bg-dark);
    }

    .tabs-container {
      display: flex;
      gap: 10px;
      margin-bottom: 1.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 1rem;
      font-weight: 600;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      border-radius: 6px;
      transition: all 0.3s;
    }

    .tab-btn.active, .tab-btn:hover {
      color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.1);
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .video-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .video-card:hover {
      border-color: var(--accent-cyan);
      box-shadow: 0 8px 20px var(--glow-blue);
      transform: translateY(-4px);
    }

    .thumbnail-container {
      position: relative;
      width: 100%;
      height: 160px;
      background: #000;
    }

    .thumbnail-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
    }

    .play-btn-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 45px; height: 45px;
      background: rgba(0, 240, 255, 0.2);
      border: 2px solid var(--accent-cyan);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 1.1rem;
    }

    .video-info {
      padding: 1rem;
    }

    .video-tag {
      font-size: 0.7rem;
      color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.1);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
    }

    .video-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }

    .video-author {
      font-size: 0.82rem;
      color: var(--text-dim);
    }

    /* Modal de Video Mejorado con Reproductor HTML5 / MP4 directo y enlace de respaldo */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(3, 8, 17, 0.95);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--accent-cyan);
      width: 100%;
      max-width: 750px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 30px var(--glow-blue);
    }

    .modal-video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 280px;
    }

    .modal-video-wrapper video {
      width: 100%;
      max-height: 400px;
      outline: none;
    }

    .modal-details {
      padding: 1.2rem;
      text-align: center;
    }

    .close-modal {
      position: absolute;
      top: 10px; right: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      width: 32px; height: 32px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    footer {
      margin-top: 3rem;
      border-top: 1px solid var(--border-glow);
      background: rgba(3, 8, 17, 0.9);
      padding: 2rem 1rem 1rem 1rem;
      text-align: center;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 1rem 0;
    }

    .social-links a {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border-glow);
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--accent-cyan);
      text-decoration: none;
    }

    .copyright {
      color: var(--text-dim);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <header>
    <div class="logo-container">
      <i class="fa-solid fa-eye eye-icon"></i>
      <span class="logo-text">LiminalShock</span>
    </div>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Buscar transmisiones..." onkeyup="filterVideos()" />
    </div>
  </header>

  <div class="main-container">
    <div class="hero-window">
      <div class="window-bar">
        <span>C:\LIMINAL_ARCHIVES\INICIO.EXE</span>
        <div class="window-controls">
          <span class="win-btn win-min"></span>
          <span class="win-btn win-max"></span>
          <span class="win-btn win-close"></span>
        </div>
      </div>
      <div class="hero-content">
        <h1>Exploración de Espacios Liminales</h1>
        <p>Transmisiones directas de archivos multimedia alternativos y visuales estéticos.</p>
        <button class="btn-liminal" onclick="playFeatured()">
          <i class="fa-solid fa-play"></i> Reproducir Transmisión Principal
        </button>
      </div>
    </div>

    <div class="tabs-container">
      <button class="tab-btn active" onclick="filterTab('all')">Todos</button>
      <button class="tab-btn" onclick="filterTab('backrooms')">Backrooms</button>
      <button class="tab-btn" onclick="filterTab('dreamcore')">Dreamcore</button>
    </div>

    <div class="video-grid" id="videoGrid"></div>
  </div>

  <!-- Modal con Reproductor HTML5 Nativo (Evita bloqueos de YouTube Localhost) -->
  <div class="modal-overlay" id="videoModal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeVideo()"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-video-wrapper">
        <video id="htmlVideoPlayer" controls playsinline>
          Tu navegador no soporta reproducción de video.
        </video>
      </div>
      <div class="modal-details">
        <h2 id="modalTitle" style="color: #fff; font-size: 1.1rem; margin-bottom: 5px;">Título</h2>
        <a id="externalLink" href="#" target="_blank" class="btn-liminal" style="font-size: 0.85rem; padding: 0.4rem 0.8rem; margin-top: 8px; text-decoration: none;">
          <i class="fa-solid fa-external-link"></i> Abrir en YouTube si falla
        </a>
      </div>
    </div>
  </div>

  <footer>
    <div class="social-links">
      <a href="https://twitter.com" target="_blank"><i class="fa-brands fa-twitter"></i></a>
      <a href="https://facebook.com" target="_blank"><i class="fa-brands fa-facebook"></i></a>
      <a href="https://youtube.com" target="_blank"><i class="fa-brands fa-youtube"></i></a>
    </div>
    <div class="copyright">&copy; 2026 LiminalShock. Plantilla comercializable.</div>
  </footer>

  <script>
    // Usamos videos de demostración en MP4 estables de código abierto que cargan al instante en cualquier móvil sin restricciones de red o localhost
    const videosData = [
      {
        id: "wBg472Tsm0s",
        title: "The Backrooms (Found Footage)",
        author: "Kane Pixels",
        category: "backrooms",
        tag: "Backrooms Nivel 0",
        thumb: "https://img.youtube.com/vi/wBg472Tsm0s/hqdefault.jpg",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" 
      },
      {
        id: "Lsy4JdQn2mo",
        title: "Dreamcore / Weirdcore Ambience",
        author: "Liminal Realm",
        category: "dreamcore",
        tag: "Dreamcore Surreal",
        thumb: "https://img.youtube.com/vi/Lsy4JdQn2mo/hqdefault.jpg",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"
      },
      {
        id: "M0X_8q_0Ols",
        title: "Windows XP / 7 Nostalgic Spaces",
        author: "Cyber Space",
        category: "backrooms",
        tag: "Nostalgia Retro",
        thumb: "https://img.youtube.com/vi/M0X_8q_0Ols/hqdefault.jpg",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4"
      }
    ];

    const videoGrid = document.getElementById('videoGrid');
    const searchInput = document.getElementById('searchInput');
    const videoModal = document.getElementById('videoModal');
    const htmlVideoPlayer = document.getElementById('htmlVideoPlayer');
    const modalTitle = document.getElementById('modalTitle');
    const externalLink = document.getElementById('externalLink');

    function renderVideos(list) {
      videoGrid.innerHTML = '';
      if(list.length === 0) {
        videoGrid.innerHTML = `<p style="color: var(--text-dim); grid-column: 1/-1; text-align: center; padding: 2rem;">No se encontraron transmisiones...</p>`;
        return;
      }

      list.forEach(video => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.onclick = () => openVideo(video);

        card.innerHTML = `
          <div class="thumbnail-container">
            <img src="${video.thumb}" alt="${video.title}" />
            <div class="play-btn-overlay">
              <i class="fa-solid fa-play"></i>
            </div>
          </div>
          <div class="video-info">
            <span class="video-tag">${video.tag}</span>
            <h3 class="video-title">${video.title}</h3>
            <div class="video-author">${video.author}</div>
          </div>
        `;
        videoGrid.appendChild(card);
      });
    }

    function openVideo(video) {
      htmlVideoPlayer.src = video.videoUrl;
      modalTitle.innerText = video.title;
      externalLink.href = `https://www.youtube.com/watch?v=${video.id}`;
      videoModal.classList.add('active');
      htmlVideoPlayer.play().catch(e => console.log("Autoplay bloqueado por navegador"));
    }

    function closeVideo() {
      htmlVideoPlayer.pause();
      htmlVideoPlayer.src = "";
      videoModal.classList.remove('active');
    }

    function playFeatured() {
      openVideo(videosData[0]);
    }

    function filterVideos() {
      const query = searchInput.value.toLowerCase();
      const filtered = videosData.filter(v => 
        v.title.toLowerCase().includes(query) || 
        v.tag.toLowerCase().includes(query)
      );
      renderVideos(filtered);
    }

    function filterTab(category) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if(category === 'all') {
        renderVideos(videosData);
      } else {
        const filtered = videosData.filter(v => v.category === category);
        renderVideos(filtered);
      }
    }

    renderVideos(videosData);
  </script>
</body>
</html>
