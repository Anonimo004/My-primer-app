<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiminalShock - Dreamcore & Weirdcore Archives</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=VT323&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg-dark: #02050a;
      --bg-card: rgba(8, 18, 35, 0.9);
      --accent-cyan: #00f0ff;
      --accent-blue: #0055ff;
      --accent-pink: #ff0055;
      --glow-cyan: rgba(0, 240, 255, 0.4);
      --text-main: #e2f1ff;
      --text-dim: #7b9acc;
      --border-glow: rgba(0, 240, 255, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(0, 85, 255, 0.2) 0%, transparent 60%),
        radial-gradient(circle at 85% 85%, rgba(255, 0, 85, 0.08) 0%, transparent 50%);
      background-attachment: fixed;
    }

    /* Efecto de pantalla CRT / Scanlines */
    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 999;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(2, 5, 10, 0.95);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border-glow);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    /* Ojo animado Dreamcore */
    .eye-container {
      position: relative;
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, #fff 30%, var(--accent-cyan) 70%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px var(--accent-cyan);
      animation: pulseEye 3s infinite alternate;
    }

    .pupil {
      width: 16px;
      height: 16px;
      background: #000;
      border-radius: 50%;
      position: absolute;
      animation: lookAround 5s infinite ease-in-out;
    }

    @keyframes lookAround {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-6px, -4px); }
      50% { transform: translate(6px, 4px); }
      75% { transform: translate(4px, -6px); }
    }

    @keyframes pulseEye {
      0% { transform: scale(1); box-shadow: 0 0 10px var(--accent-cyan); }
      100% { transform: scale(1.1); box-shadow: 0 0 20px var(--accent-pink); }
    }

    .logo-text {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(45deg, #ffffff, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 220px;
      max-width: 420px;
    }

    .search-box input {
      width: 100%;
      padding: 0.65rem 1rem 0.65rem 2.6rem;
      border-radius: 25px;
      border: 1px solid var(--border-glow);
      background: rgba(8, 18, 35, 0.9);
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s;
    }

    .search-box input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 15px var(--glow-cyan);
    }

    .search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent-cyan);
    }

    .main-container {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* Ventana Hero */
    .hero-window {
      background: var(--bg-card);
      border: 1px solid var(--accent-cyan);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px var(--glow-cyan);
      margin-bottom: 2.5rem;
    }

    .window-bar {
      background: linear-gradient(90deg, #002244, #0044aa);
      padding: 0.5rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
    }

    .window-controls {
      display: flex;
      gap: 6px;
    }

    .win-btn {
      width: 12px; height: 12px; border-radius: 50%; display: inline-block;
    }
    .win-close { background: #ff5f56; }
    .win-min { background: #ffbd2e; }
    .win-max { background: #27c93f; }

    .hero-content {
      padding: 2.5rem 1.5rem;
      text-align: center;
      background: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1200&auto=format&fit=crop&q=80') center/cover no-repeat;
      position: relative;
    }

    .hero-content::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 5, 10, 0.85);
      z-index: 1;
    }

    .hero-content > * {
      position: relative;
      z-index: 2;
    }

    .hero-content h1 {
      font-size: 2.4rem;
      margin-bottom: 0.8rem;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
    }

    .hero-content p {
      color: var(--text-dim);
      font-size: 1.05rem;
      margin-bottom: 1.5rem;
      max-width: 650px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn-liminal {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(0, 85, 255, 0.3));
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
      text-decoration: none;
    }

    .btn-liminal:hover {
      background: var(--accent-cyan);
      color: var(--bg-dark);
      box-shadow: 0 0 20px var(--accent-cyan);
    }

    /* Pestañas */
    .tabs-container {
      display: flex;
      gap: 12px;
      margin-bottom: 2rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--border-glow);
      color: var(--text-dim);
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.5rem 1.2rem;
      cursor: pointer;
      white-space: nowrap;
      border-radius: 8px;
      transition: all 0.3s;
    }

    .tab-btn.active, .tab-btn:hover {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.1);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    /* Grid de Videos */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    .video-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .video-card:hover {
      border-color: var(--accent-cyan);
      box-shadow: 0 10px 25px var(--glow-cyan);
      transform: translateY(-5px);
    }

    .thumbnail-container {
      position: relative;
      width: 100%;
      height: 180px;
      background: #000;
      overflow: hidden;
    }

    .thumbnail-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
      transition: transform 0.5s ease;
    }

    .video-card:hover .thumbnail-container img {
      transform: scale(1.08);
      opacity: 1;
    }

    .play-btn-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 50px; height: 50px;
      background: rgba(0, 240, 255, 0.25);
      border: 2px solid var(--accent-cyan);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 1.2rem;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 15px var(--accent-cyan);
    }

    .video-info {
      padding: 1.2rem;
    }

    .video-tag {
      font-size: 0.72rem;
      color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.12);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      font-weight: 600;
    }

    .video-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .video-author {
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    /* Modal con Reproductor HTML5 Nativo (Carga 100% garantizada) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(2, 5, 10, 0.96);
      backdrop-filter: blur(15px);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--accent-cyan);
      width: 100%;
      max-width: 800px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 40px var(--glow-cyan);
    }

    .modal-video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-video-wrapper video {
      width: 100%;
      max-height: 450px;
      outline: none;
    }

    .modal-details {
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .close-modal {
      position: absolute;
      top: 12px; right: 15px;
      background: rgba(0, 0, 0, 0.8);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      width: 36px; height: 36px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.1rem;
    }

    footer {
      margin-top: 4rem;
      border-top: 1px solid var(--border-glow);
      background: rgba(2, 5, 10, 0.95);
      padding: 2.5rem 1rem 1.5rem 1rem;
      text-align: center;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 1.2rem 0;
    }

    .social-links a {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border-glow);
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--accent-cyan);
      text-decoration: none;
      transition: all 0.3s;
    }

    .social-links a:hover {
      background: var(--accent-cyan);
      color: var(--bg-dark);
      box-shadow: 0 0 15px var(--accent-cyan);
    }

    .copyright {
      color: var(--text-dim);
      font-size: 0.82rem;
    }
  </style>
</head>
<body>

  <!-- Header con Ojo Animado -->
  <header>
    <div class="logo-container" onclick="location.reload()">
      <div class="eye-container">
        <div class="pupil"></div>
      </div>
      <span class="logo-text">LiminalShock</span>
    </div>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Buscar casas liminales, ojos, anomalías..." onkeyup="filterVideos()" />
    </div>
  </header>

  <!-- Container -->
  <div class="main-container">
    <div class="hero-window">
      <div class="window-bar">
        <span>C:\DREAMCORE\CASA_LIMINAL.EXE</span>
        <div class="window-controls">
          <span class="win-btn win-min"></span>
          <span class="win-btn win-max"></span>
          <span class="win-btn win-close"></span>
        </div>
      </div>
      <div class="hero-content">
        <h1>Casas Liminales & Archivos Surrealistas</h1>
        <p>Transmisiones directas de espacios nostálgicos, ojos flotantes y memorias atemporales.</p>
        <button class="btn-liminal" onclick="playFeatured()">
          <i class="fa-solid fa-play"></i> Reproducir Transmisión Principal
        </button>
      </div>
    </div>

    <!-- Filtros -->
    <div class="tabs-container">
      <button class="tab-btn active" onclick="filterTab('all')">Todos los Archivos</button>
      <button class="tab-btn" onclick="filterTab('dreamcore')">Casas Dreamcore</button>
      <button class="tab-btn" onclick="filterTab('eyes')">Anomalías Oculares</button>
      <button class="tab-btn" onclick="filterTab('backrooms')">Backrooms</button>
    </div>

    <!-- Grid de Videos -->
    <div class="video-grid" id="videoGrid"></div>
  </div>

  <!-- Modal con Reproductor HTML5 Nativo Directo -->
  <div class="modal-overlay" id="videoModal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeVideo()"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-video-wrapper">
        <video id="htmlVideoPlayer" controls playsinline>
          Tu navegador no soporta reproducción de video.
        </video>
      </div>
      <div class="modal-details">
        <div>
          <h2 id="modalTitle" style="color: #fff; font-size: 1.15rem; margin-bottom: 4px;">Título</h2>
          <span id="modalTag" class="video-tag">CATEGORÍA</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="logo-container" style="justify-content: center; margin-bottom: 0.5rem;">
      <i class="fa-solid fa-eye" style="color: var(--accent-cyan);"></i>
      <span style="font-weight: 700; letter-spacing: 1px;">LiminalShock Network</span>
    </div>
    <div class="social-links">
      <a href="https://twitter.com" target="_blank"><i class="fa-brands fa-twitter"></i></a>
      <a href="https://facebook.com" target="_blank"><i class="fa-brands fa-facebook"></i></a>
      <a href="https://youtube.com" target="_blank"><i class="fa-brands fa-youtube"></i></a>
      <a href="https://instagram.com" target="_blank"><i class="fa-brands fa-instagram"></i></a>
    </div>
    <div class="copyright">&copy; 2026 LiminalShock. Plantilla comercializable lista para GitHub Pages.</div>
  </footer>

  <script>
    // Enlaces de video MP4 directos estables y sin restricciones de YouTube/localhost
    const videosData = [
      {
        title: "Casa Suburbana Liminal (Atardecer Infinito)",
        author: "Dreamcore Archive",
        category: "dreamcore",
        tag: "Casa Dreamcore",
        thumb: "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=600&auto=format&fit=crop&q=80",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
      },
      {
        title: "Anomalía Ocular & Mirada Surrealista",
        author: "Weirdcore Entity",
        category: "eyes",
        tag: "Ojos / Surreal",
        thumb: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=600&auto=format&fit=crop&q=80",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"
      },
      {
        title: "Habitación Vacía de la Infancia",
        author: "Nostalgia 99",
        category: "dreamcore",
        tag: "Nostalgia Liminal",
        thumb: "https://images.unsplash.com/photo-1513694203232-719a280e022f?w=600&auto=format&fit=crop&q=80",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4"
      },
      {
        title: "Pasillos Infinitos Nivel 0 (Backrooms)",
        author: "Kane Archives",
        category: "backrooms",
        tag: "Backrooms Nivel 0",
        thumb: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&auto=format&fit=crop&q=80",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4"
      }
    ];

    const videoGrid = document.getElementById('videoGrid');
    const searchInput = document.getElementById('searchInput');
    const videoModal = document.getElementById('videoModal');
    const htmlVideoPlayer = document.getElementById('htmlVideoPlayer');
    const modalTitle = document.getElementById('modalTitle');
    const modalTag = document.getElementById('modalTag');

    function renderVideos(list) {
      videoGrid.innerHTML = '';
      if(list.length === 0) {
        videoGrid.innerHTML = `<p style="color: var(--text-dim); grid-column: 1/-1; text-align: center; padding: 2rem;">No se encontraron transmisiones...</p>`;
        return;
      }

      list.forEach(video => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.onclick = () => openVideo(video);

        card.innerHTML = `
          <div class="thumbnail-container">
            <img src="${video.thumb}" alt="${video.title}" />
            <div class="play-btn-overlay">
              <i class="fa-solid fa-play"></i>
            </div>
          </div>
          <div class="video-info">
            <span class="video-tag">${video.tag}</span>
            <h3 class="video-title">${video.title}</h3>
            <div class="video-author"><i class="fa-solid fa-eye" style="color: var(--accent-cyan); font-size: 0.8rem;"></i> ${video.author}</div>
          </div>
        `;
        videoGrid.appendChild(card);
      });
    }

    function openVideo(video) {
      htmlVideoPlayer.src = video.videoUrl;
      modalTitle.innerText = video.title;
      modalTag.innerText = video.tag;
      videoModal.classList.add('active');
      htmlVideoPlayer.play().catch(e => console.log("Reproducción automática con interacción requerida"));
    }

    function closeVideo() {
      htmlVideoPlayer.pause();
      htmlVideoPlayer.src = "";
      videoModal.classList.remove('active');
    }

    function playFeatured() {
      openVideo(videosData[0]);
    }

    function filterVideos() {
      const query = searchInput.value.toLowerCase();
      const filtered = videosData.filter(v => 
        v.title.toLowerCase().includes(query) || 
        v.tag.toLowerCase().includes(query) ||
        v.author.toLowerCase().includes(query)
      );
      renderVideos(filtered);
    }

    function filterTab(category) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if(category === 'all') {
        renderVideos(videosData);
      } else {
        const filtered = videosData.filter(v => v.category === category);
        renderVideos(filtered);
      }
    }

    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape') closeVideo();
    });

    renderVideos(videosData);
  </script>
</body>
</html>
